<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Volante EcoDesafío - Luces de Ritmo</title>

    <style>

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;

            background-color: #2ecc71;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition: background-color 0.2s ease;

            overflow: hidden;
        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
           ===================================================== */

        #tablero-luces {
            display: flex;
            width: 90%;
            justify-content: space-between;
            align-items: center;
        }


        /* =====================================================
           GRUPOS IZQUIERDO Y DERECHO
           ===================================================== */

        .grupo-luces {
            width: 42%;
        }


        /* Contenedor que incluye título + luces */

        .grupo-con-titulo {
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =====================================================
           TÍTULOS
           ===================================================== */

        .titulo-luces {
            width: 100%;

            text-align: center;

            font-size: 4vh;
            font-weight: bold;

            color: white;

            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);

            margin-bottom: 2vh;
        }


        /* =====================================================
           FILA DE LUCES
           ===================================================== */

        .luces-fila {
            display: flex;

            gap: 2vw;

            width: 100%;
        }


        /* Izquierda: las luces se encienden de derecha a izquierda */

        #grupo-izquierdo .luces-fila {
            justify-content: flex-end;
        }


        /* Derecha: las luces se encienden de izquierda a derecha */

        #grupo-derecho .luces-fila {
            justify-content: flex-start;
        }


        /* =====================================================
           LUCES
           ===================================================== */

        .luz {
            width: 28%;

            height: 35vh;

            border: 4px solid white;

            border-radius: 15px;

            background-color: rgba(255, 255, 255, 0.15);

            box-sizing: border-box;
        }


        /* =====================================================
           VELOCIDAD EN EL CENTRO
           ===================================================== */

        #velocidad-centro {

            width: 16%;

            text-align: center;

            font-size: 8vh;

            font-weight: bold;

            color: white;

            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }


        /* =====================================================
           AJUSTES PARA TELÉFONOS
           ===================================================== */

        @media (max-width: 600px) {

            #tablero-luces {
                width: 96%;
            }

            .grupo-luces {
                width: 40%;
            }

            .titulo-luces {
                font-size: 3.5vh;
                margin-bottom: 1.5vh;
            }

            .luces-fila {
                gap: 1.5vw;
            }

            .luz {
                height: 32vh;
                border-width: 3px;
                border-radius: 10px;
            }

            #velocidad-centro {
                width: 20%;
                font-size: 7vh;
            }
        }

    </style>
</head>


<body>

    <div id="tablero-luces">


        <!-- =================================================
             LUCES DE LA IZQUIERDA
             ================================================= -->

        <div class="grupo-luces grupo-con-titulo" id="grupo-izquierdo">

            <div class="titulo-luces">
                Acelerar
            </div>

            <div class="luces-fila">

                <div class="luz" id="izq-3"></div>

                <div class="luz" id="izq-2"></div>

                <div class="luz" id="izq-1"></div>

            </div>

        </div>


        <!-- =================================================
             VELOCIDAD REAL
             ================================================= -->

        <div id="velocidad-centro">
            --
        </div>


        <!-- =================================================
             LUCES DE LA DERECHA
             ================================================= -->

        <div class="grupo-luces grupo-con-titulo" id="grupo-derecho">

            <div class="titulo-luces">
                Desacelerar
            </div>

            <div class="luces-fila">

                <div class="luz" id="der-1"></div>

                <div class="luz" id="der-2"></div>

                <div class="luz" id="der-3"></div>

            </div>

        </div>


    </div>


    <script>

        let TABLA_ESTRATEGIA = [];


        // =====================================================
        // MAPA DE LA PISTA
        // =====================================================

        const MAPA_PISTA = [

            [-31.43343176, -64.2770109, 0.],

            [-31.43340430, -64.2765416, 45.],

            [-31.43227373, -64.2766247, 175.],

            [-31.43231836, -64.2775742, 265.],

            [-31.43344893, -64.2775796, 395.],

            [-31.43343176, -64.2770109, 448.]

        ];


        // =====================================================
        // CARGAR ESTRATEGIA
        // =====================================================

        async function actualizarEstrategiaDesdeBoxes() {

            try {

                const respuesta =
                    await fetch('datos.json?cache_bypass=' + Date.now());

                TABLA_ESTRATEGIA =
                    await respuesta.json();

            } catch (error) {

                console.log("Usando estrategia en memoria.");

            }

        }


        setInterval(
            actualizarEstrategiaDesdeBoxes,
            5000
        );


        actualizarEstrategiaDesdeBoxes();


        // =====================================================
        // DISTANCIA ENTRE COORDENADAS GPS
        // =====================================================

        function calcularDistancia(
            lat1,
            lon1,
            lat2,
            lon2
        ) {

            const R = 6371000;

            const dLat =
                (lat2 - lat1) *
                Math.PI / 180;

            const dLon =
                (lon2 - lon1) *
                Math.PI / 180;

            const a =
                Math.sin(dLat/2) *
                Math.sin(dLat/2) +

                Math.cos(lat1 * Math.PI / 180) *
                Math.cos(lat2 * Math.PI / 180) *

                Math.sin(dLon/2) *
                Math.sin(dLon/2);

            return R *
                (
                    2 *
                    Math.atan2(
                        Math.sqrt(a),
                        Math.sqrt(1-a)
                    )
                );

        }


        // =====================================================
        // APAGAR TODAS LAS LUCES
        // =====================================================

        function apagarTodasLasLuces() {

            const luces =
                document.querySelectorAll('.luz');

            luces.forEach(

                luz =>

                luz.style.backgroundColor =
                    "rgba(255, 255, 255, 0.15)"

            );

        }


        // =====================================================
        // PROCESAMIENTO GPS
        // =====================================================

        function procesarGps(
            latActual,
            lonActual,
            velocidadMps
        ) {

            if (TABLA_ESTRATEGIA.length === 0) {

                document
                    .getElementById("velocidad-centro")
                    .innerText = "---";

                return;
            }


            // -------------------------------------------------
            // VELOCIDAD REAL
            // -------------------------------------------------

            let kmhReal =
                Math.round(
                    (velocidadMps || 0) * 3.6
                );


            document
                .getElementById("velocidad-centro")
                .innerText = kmhReal;


            // -------------------------------------------------
            // ENCONTRAR TRAMO DE LA PISTA
            // -------------------------------------------------

            let distMinima = Infinity;

            let metrosActuales = 0;


            for (let punto of MAPA_PISTA) {

                let d =
                    calcularDistancia(
                        latActual,
                        lonActual,
                        punto[0],
                        punto[1]
                    );

                if (d < distMinima) {

                    distMinima = d;

                    metrosActuales = punto[2];

                }

            }


            // -------------------------------------------------
            // VELOCIDAD IDEAL
            // -------------------------------------------------

            let kmhIdeal = 0;


            for (
                let rango of TABLA_ESTRATEGIA
            ) {

                if (
                    metrosActuales >= rango.metros
                ) {

                    kmhIdeal =
                        rango.v_ideal;

                }

            }


            // -------------------------------------------------
            // APAGAR LUCES
            // -------------------------------------------------

            apagarTodasLasLuces();


            // -------------------------------------------------
            // DIFERENCIA DE VELOCIDAD
            // -------------------------------------------------

            let diferencia =
                kmhReal - kmhIdeal;


            // =================================================
            // EXCESO DE VELOCIDAD
            // =================================================

            if (diferencia >= 2) {

                document.body.style.backgroundColor =
                    "#c0392b";


                document.getElementById(
                    "izq-1"
                ).style.backgroundColor = "white";


                if (diferencia >= 4)

                    document.getElementById(
                        "izq-2"
                    ).style.backgroundColor = "white";


                if (diferencia >= 6)

                    document.getElementById(
                        "izq-3"
                    ).style.backgroundColor = "white";

            }


            // =================================================
            // FALTA DE VELOCIDAD
            // =================================================

            else if (diferencia <= -2) {

                document.body.style.backgroundColor =
                    "#d35400";


                document.getElementById(
                    "der-1"
                ).style.backgroundColor = "white";


                if (diferencia <= -4)

                    document.getElementById(
                        "der-2"
                    ).style.backgroundColor = "white";


                if (diferencia <= -6)

                    document.getElementById(
                        "der-3"
                    ).style.backgroundColor = "white";

            }


            // =================================================
            // VELOCIDAD ÓPTIMA
            // =================================================

            else {

                document.body.style.backgroundColor =
                    "#2ecc71";

            }

        }


        // =====================================================
        // GPS
        // =====================================================

        if (navigator.geolocation) {

            navigator.geolocation.watchPosition(

                (pos) => {

                    procesarGps(

                        pos.coords.latitude,

                        pos.coords.longitude,

                        pos.coords.speed

                    );

                },

                (err) => {

                    document
                        .getElementById(
                            "velocidad-centro"
                        )
                        .innerText = "ERR";

                },

                {

                    enableHighAccuracy: true,

                    timeout: 5000,

                    maximumAge: 0

                }

            );

        }

        else {

            document
                .getElementById(
                    "velocidad-centro"
                )
                .innerText = "GPS?";

        }

    </script>

</body>
</html>
