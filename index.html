<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Volante - EcoDesafío</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* BANNER DE LUCES LED */
        .luces-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
            gap: 40px; /* Separación amplia entre ambos bloques */
            background-color: #1e1e1e;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .bloque-indicador {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            gap: 8px;
        }

        .cartel-indicador {
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        .cartel-indicador.acelerar {
            color: #27ae60;
        }

        .cartel-indicador.desacelerar {
            color: #e74c3c;
        }

        .grupo-luces {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .grupo-luces.derecha {
            justify-content: flex-end;
        }

        .led {
            width: 100%;
            height: 45px;
            border-radius: 8px;
            background-color: #ffffff;
            border: 2px solid #333;
            transition: background-color 0.1s ease, box-shadow 0.1s ease;
        }

        /* DISPLAY PRINCIPAL DE VELOCIDAD */
        .display-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            margin: 20px 0;
        }

        .label {
            font-size: 1.2rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .velocidad-valor {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .unidad {
            font-size: 2rem;
            color: #888;
            margin-top: 5px;
        }

        /* PANEL INFERIOR DE DATOS */
        .panel-inferior {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 900px;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 15px;
        }

        .dato-box {
            text-align: center;
        }

        .dato-valor {
            font-size: 2.5rem;
            font-weight: bold;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <!-- BANDA DE LUCES (SHIFT / STRATEGY LIGHTS) -->
    <div class="luces-container">
        <!-- Bloque Izquierda: ACELERAR -->
        <div class="bloque-indicador">
            <div class="cartel-indicador acelerar">Acelerar</div>
            <div class="grupo-luces izquierda">
                <div id="izq-3" class="led"></div>
                <div id="izq-2" class="led"></div>
                <div id="izq-1" class="led"></div>
            </div>
        </div>

        <!-- Bloque Derecha: DESACELERAR -->
        <div class="bloque-indicador">
            <div class="cartel-indicador desacelerar">Desacelerar</div>
            <div class="grupo-luces derecha">
                <div id="der-1" class="led"></div>
                <div id="der-2" class="led"></div>
                <div id="der-3" class="led"></div>
            </div>
        </div>
    </div>

    <!-- DISPLAY CENTRAL -->
    <div class="display-container">
        <div class="label">Velocidad Actual</div>
        <div id="velocidad-actual" class="velocidad-valor">0.0</div>
        <div class="unidad">KM/H</div>
    </div>

    <!-- DATOS DE TELEMETRÍA/ESTRATEGIA -->
    <div class="panel-inferior">
        <div class="dato-box">
            <div class="label">V. Ideal</div>
            <div id="velocidad-ideal" class="dato-valor">0.0</div>
        </div>
        <div class="dato-box">
            <div class="label">Metros</div>
            <div id="metros-actuales" class="dato-valor">0</div>
        </div>
    </div>

    <script>
        // ==========================================
        // ESTADO GLOBAL Y CONFIGURACIÓN
        // ==========================================
        let tablaEstrategia = [];
        let mapaLista = [];

        const KX_METROS = 94960; // Proyección para Córdoba (~-31.43°)
        const KY_METROS = 111000;

        let ultimasVelocidades = [];
        const TAMANO_FILTRO_GPS = 3;

        // Cache DOM
        const domLuces = {
            'izq-3': document.getElementById('izq-3'),
            'izq-2': document.getElementById('izq-2'),
            'izq-1': document.getElementById('izq-1'),
            'der-1': document.getElementById('der-1'),
            'der-2': document.getElementById('der-2'),
            'der-3': document.getElementById('der-3')
        };
        const domVelocidad = document.getElementById('velocidad-actual');
        const domIdeal = document.getElementById('velocidad-ideal');
        const domMetros = document.getElementById('metros-actuales');

        // ==========================================
        // CARGA DE DATOS EXTERNOS (FETCH)
        // ==========================================
        async function cargarConfiguracion() {
            try {
                const [resEstrategia, resMapa] = await Promise.all([
                    fetch('estrategia.json'),
                    fetch('mapa.json')
                ]);

                if (!resEstrategia.ok || !resMapa.ok) {
                    throw new Error('Error al solicitar los JSONs al servidor.');
                }

                tablaEstrategia = await resEstrategia.json();
                mapaLista = await resMapa.json();

                iniciarGPS();
            } catch (error) {
                console.error('Error cargando datos del servidor:', error);
            }
        }

        // ==========================================
        // CÁLCULOS GEOMÉTRICOS Y ESTRATEGIA
        // ==========================================
        function calcularDistanciaRapida(lat1, lon1, lat2, lon2) {
            const dx = (lon2 - lon1) * KX_METROS;
            const dy = (lat2 - lat1) * KY_METROS;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function obtenerMetrosActuales(lat, lon) {
            if (!mapaLista.length) return 0;

            let distanciaMinima = Infinity;
            let nodoMasCercano = mapaLista[0];

            for (let i = 0; i < mapaLista.length; i++) {
                const d = calcularDistanciaRapida(lat, lon, mapaLista[i].lat, mapaLista[i].lon);
                if (d < distanciaMinima) {
                    distanciaMinima = d;
                    nodoMasCercano = mapaLista[i];
                }
            }

            return nodoMasCercano.metros;
        }

        function obtenerVelocidadIdeal(metrosActuales) {
            if (!tablaEstrategia.length) return 0;
            
            const rango = tablaEstrategia.find(r => metrosActuales <= r.metros);
            return rango ? rango.v_ideal : tablaEstrategia[tablaEstrategia.length - 1].v_ideal;
        }

        function filtrarVelocidad(vKmh) {
            ultimasVelocidades.push(vKmh);
            if (ultimasVelocidades.length > TAMANO_FILTRO_GPS) {
                ultimasVelocidades.shift();
            }
            return ultimasVelocidades.reduce((a, b) => a + b, 0) / ultimasVelocidades.length;
        }

        // ==========================================
        // RENDERIZADO Y PANTALLA
        // ==========================================
        function setLuz(id, color, glowColor) {
            const elem = domLuces[id];
            if (elem) {
                elem.style.backgroundColor = color;
                elem.style.boxShadow = glowColor ? `0 0 15px ${glowColor}` : 'none';
            }
        }

        function actualizarLuces(diferencia) {
            const verde = '#27ae60';
            const rojo = '#e74c3c';
            const blancoApagado = '#ffffff';

            // Lento -> Prende luces verdes progresivas a la izquierda
            setLuz('izq-1', diferencia <= -2 ? verde : blancoApagado, diferencia <= -2 ? verde : null);
            setLuz('izq-2', diferencia <= -4 ? verde : blancoApagado, diferencia <= -4 ? verde : null);
            setLuz('izq-3', diferencia <= -6 ? verde : blancoApagado, diferencia <= -6 ? verde : null);

            // Rápido -> Prende luces rojas progresivas a la derecha
            setLuz('der-1', diferencia >= 2 ? rojo : blancoApagado, diferencia >= 2 ? rojo : null);
            setLuz('der-2', diferencia >= 4 ? rojo : blancoApagado, diferencia >= 4 ? rojo : null);
            setLuz('der-3', diferencia >= 6 ? rojo : blancoApagado, diferencia >= 6 ? rojo : null);
        }

        // ==========================================
        // PROCESAMIENTO GPS
        // ==========================================
        function procesarPosicionGPS(posicion) {
            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;

            const metrosActuales = obtenerMetrosActuales(lat, lon);

            const vMps = posicion.coords.speed !== null ? posicion.coords.speed : 0;
            const vKmhFiltrada = filtrarVelocidad(vMps * 3.6);

            const vIdeal = obtenerVelocidadIdeal(metrosActuales);
            const diferencia = vKmhFiltrada - vIdeal;

            if (domVelocidad) domVelocidad.textContent = vKmhFiltrada.toFixed(1);
            if (domIdeal) domIdeal.textContent = vIdeal.toFixed(1);
            if (domMetros) domMetros.textContent = Math.round(metrosActuales);

            actualizarLuces(diferencia);
        }

        function iniciarGPS() {
            if ('navigator' in window && 'geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    procesarPosicionGPS,
                    (err) => console.error('Error GPS:', err),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        // Bloqueo de suspensión de pantalla
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }

        // Inicio
        cargarConfiguracion();
    </script>
</body>
</html>
