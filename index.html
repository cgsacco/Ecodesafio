<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <!-- Meta etiquetas para Web App (PWA) / Safari iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">

    <title>Volante EcoDesafío - Luces de Ritmo</title>
    <style>

        /* =====================================================
           PÁGINA
           ===================================================== */

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: red;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s ease;
            overflow: hidden;
        }

        /* =====================================================
           BOTÓN PANTALLA COMPLETA / INICIO
           ===================================================== */

        #btn-fullscreen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 2.5vh 4vw;
            font-size: 4vh;
            font-weight: bold;
            background-color: #28a745;
            color: white;
            border: 4px solid white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 9999;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        #btn-fullscreen:active {
            background-color: #218838;
            transform: translate(-50%, -48%);
        }

        /* =====================================================
           TABLERO PRINCIPAL
           ===================================================== */

        #tablero-luces {
            display: flex;
            width: 90%;
            justify-content: space-between;
            align-items: center;
        }

        /* =====================================================
           GRUPOS DE LUCES
           ===================================================== */

        .grupo-luces {
            width: 42%;
        }

        .grupo-con-titulo {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =====================================================
           TÍTULOS
           ===================================================== */

        .titulo-luces {
            width: 100%;
            text-align: center;
            font-size: 4vh;
            font-weight: bold;
            color: white;
            text-shadow:
                2px 2px 4px rgba(0,0,0,0.4);
            margin-bottom: 2vh;
        }

        /* =====================================================
           FILA DE LUCES
           ===================================================== */

        .luces-fila {
            display: flex;
            gap: 2vw;
            width: 100%;
        }

        /* Izquierda:
           3     2     1
                       ↑
                 más cercana al centro
        */

        #grupo-izquierdo .luces-fila {
            justify-content: flex-end;
        }


        /* Derecha:
           1     2     3
           ↑
           más cercana al centro
        */

        #grupo-derecho .luces-fila {
            justify-content: flex-start;
        }


        /* =====================================================
           LUCES
           ===================================================== */

        .luz {
            width: 28%;
            height: 25vh;
            border: 4px solid white;
            border-radius: 15px;
            /* Blanco = estado normal / apagada */
            background-color: white;
            box-sizing: border-box;
        }

        /* =====================================================
           VELOCIDAD CENTRAL
           ===================================================== */

        #velocidad-centro {
            width: 16%;
            text-align: center;
            color: black;
            font-weight: bold;
        }


        #velocidad-real {
            font-size: 8vh;
            line-height: 1;
        }


        #velocidad-ideal {
            font-size: 3vh;
            margin-top: 1vh;
            white-space: nowrap;
        }

        #distancia-recorrida {
            font-size: 2.5vh;
            margin-top: 0.5vh;
            white-space: nowrap;
            color: #111;
        }


        /* =====================================================
           ADAPTACIÓN PARA TELÉFONOS
           ===================================================== */

        @media (max-width: 600px) {

            #tablero-luces {
                width: 96%;
            }

            .grupo-luces {
                width: 40%;
            }

            .titulo-luces {
                font-size: 3.5vh;
                margin-bottom: 1.5vh;
            }


            .luces-fila {
                gap: 1.5vw;
            }


            .luz {
                height: 32vh;
                border-width: 3px;
                border-radius: 10px;
            }


            #velocidad-centro {
                width: 20%;
            }


            #velocidad-real {
                font-size: 7vh;
            }


            #velocidad-ideal {
                font-size: 2.5vh;
                margin-top: 1vh;
            }

            #distancia-recorrida {
                font-size: 2vh;
            }
        }

    </style>

</head>

<body>

    <!-- =====================================================
         BOTÓN INICIAL PANTALLA COMPLETA
         ===================================================== -->
    <button id="btn-fullscreen" onclick="iniciarModoVolante()">
        ▶ INICIAR VOLANTE
    </button>

    <!-- =====================================================
         TABLERO
         ===================================================== -->

    <div id="tablero-luces">

        <!-- =================================================
             ACELERAR - IZQUIERDA
             ================================================= -->

        <div class="grupo-luces grupo-con-titulo"
             id="grupo-izquierdo">
            <div class="titulo-luces">
                Acelerar
            </div>
            <div class="luces-fila">
                <!-- Más alejada del centro -->
                <div class="luz"
                     id="izq-3">
                </div>

                <div class="luz"
                     id="izq-2">
                </div>

                <!-- Más cercana al centro -->

                <div class="luz"
                     id="izq-1">
                </div>
            </div>
        </div>

        <!-- =================================================
             VELOCIDADES Y DISTANCIA
             ================================================= -->

        <div id="velocidad-centro">
            <div id="velocidad-real">
                --
            </div>
            <div id="velocidad-ideal">
                Ideal: --
            </div>
            <div id="distancia-recorrida">
                0 m
            </div>
        </div>

        <!-- =================================================
             DESACELERAR - DERECHA
             ================================================= -->
        <div class="grupo-luces grupo-con-titulo"
             id="grupo-derecho">
            <div class="titulo-luces">
                Desacelerar
            </div>
            <div class="luces-fila">
                <!-- Más cercana al centro -->
                <div class="luz"
                     id="der-1">
                </div>

                <div class="luz"
                     id="der-2">
                </div>

                <!-- Más alejada del centro -->

                <div class="luz"
                     id="der-3">
                </div>
            </div>
        </div>
    </div>

    <script>

        /* =====================================================
           GESTOR DE PANTALLA ENCENDIDA (WAKE LOCK)
           ===================================================== */
        let wakeLock = null;

        async function bloquearApagadoPantalla() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log("Pantalla bloqueada: No se apagará automáticamente.");
                }
            } catch (err) {
                console.log("Wake Lock no disponible o denegado:", err);
            }
        }

        // Si la app vuelve a estar visible, reactivar el bloqueo
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await bloquearApagadoPantalla();
            }
        });

        /* =====================================================
           INICIAR PANTALLA COMPLETA Y ORIENTACIÓN HORIZONTAL
           ===================================================== */
        function iniciarModoVolante() {
            const docEl = document.documentElement;

            if (docEl.requestFullscreen) {
                docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) {
                docEl.msRequestFullscreen();
            }

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch((err) => {
                    console.log("No se pudo bloquear la orientación:", err);
                });
            }

            bloquearApagadoPantalla();
            document.getElementById('btn-fullscreen').style.display = 'none';
        }

        /* =====================================================
           VARIABLES
           ===================================================== */

        let TABLA_ESTRATEGIA = [];
        let MAPA_PISTA = [];

        /* =====================================================
           CARGAR TABLA DE ESTRATEGIA
           ===================================================== */
        async function actualizarEstrategiaDesdeBoxes() {
            try {
                const respuesta =
                    await fetch(
                        'datos.json?cache_bypass='
                        + Date.now()
                    );

                TABLA_ESTRATEGIA =
                    await respuesta.json();
                console.log(
                    "Estrategia cargada:",
                    TABLA_ESTRATEGIA.length,
                    "registros"
                );
            }

            catch (error) {
                console.log(
                    "Error cargando datos.json:",
                    error
                );
            }
        }

        /* =====================================================
           CARGAR MAPA DE LA PISTA
           ===================================================== */

        async function actualizarMapaPista() {
            try {
                const respuesta =
                    await fetch(
                        'mapa_pista.json?cache_bypass='
                        + Date.now()
                    );

                MAPA_PISTA =
                    await respuesta.json();

                console.log(
                    "Mapa de pista cargado:",
                     MAPA_PISTA.length,
                    "puntos"
                );
            }

            catch (error) {
                console.log(
                    "Error cargando mapa_pista.json:",
                    error
                );
            }
        }

        /* =====================================================
           CARGA INICIAL
           ===================================================== */
        actualizarEstrategiaDesdeBoxes();
        actualizarMapaPista();

        /* =====================================================
           ACTUALIZACIÓN PERIÓDICA
           ===================================================== */

        setInterval(
            actualizarEstrategiaDesdeBoxes,
            5000
        );

        /* =====================================================
           DISTANCIA ENTRE DOS PUNTOS GPS
           ===================================================== */

        function calcularDistancia(lat1,lon1,lat2,lon2)
        {
            const R = 6371000;
            const dLat = (lat2 - lat1)* Math.PI / 180;
            const dLon = (lon2 - lon1)* Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
                    + Math.cos(lat1 * Math.PI / 180)*Math.cos(
                        lat2 * Math.PI / 180)* Math.sin(dLon / 2) *
                    Math.sin(dLon / 2);
            const c = (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
            return R * c;
        }

        /* =====================================================
           APAGAR / RESTABLECER TODAS LAS LUCES
           ===================================================== */

        function apagarTodasLasLuces() {
            const luces =
                document.querySelectorAll('.luz');
            luces.forEach(
                luz => {
                    luz.style.backgroundColor =
                        "white";
                }
            );
        }

        /* =====================================================
           PROCESAMIENTO GPS
           ===================================================== */
        function procesarGps(latActual,lonActual,velocidadMps)
        {
            /* VELOCIDAD REAL */
            let kmhReal = Math.round(
                (velocidadMps || 0) * 3.6
            );
            
            document
                .getElementById("velocidad-real")
                .innerText = kmhReal;
            
            /* TODAVÍA NO TENEMOS LA ESTRATEGIA */
            if (TABLA_ESTRATEGIA.length === 0) {
                document
                    .getElementById("velocidad-ideal")
                    .innerText = "Ideal: --";
                return;
            }
            
            /* TODAVÍA NO TENEMOS EL MAPA */
            if (MAPA_PISTA.length === 0) {
                document
                    .getElementById("velocidad-ideal")
                    .innerText = "Ideal: --";
                return;
            }
            
            /* BUSCAR POSICIÓN MÁS CERCANA EN EL MAPA */
            let distMinima = Infinity;
            let metrosActuales = 0;
            
            for (let punto of MAPA_PISTA) {    
                let d = calcularDistancia(
                    latActual,
                    lonActual,
                    punto.lat,
                    punto.lon
                );
                
                if (d < distMinima) {          
                    distMinima = d;          
                    metrosActuales = punto.metros;          
                }
            }
            
            /* MOSTRAR DISTANCIA LINEAL */
            document.getElementById("distancia-recorrida").innerText = Math.round(metrosActuales) + " m";

            /* OBTENER VELOCIDAD IDEAL */
            let kmhIdeal = 0;
            for (let rango of TABLA_ESTRATEGIA) {          
                if (metrosActuales >= rango.metros) {          
                    kmhIdeal = rango.v_ideal;          
                }
            }
            
            /* MOSTRAR VELOCIDAD IDEAL */
            let kmhIdealMostrar = Math.round(kmhIdeal);
            
            document.getElementById("velocidad-ideal").innerText = "Ideal: "
                + kmhIdealMostrar + " km/h";
            
            /* RESTABLECER LAS SEIS LUCES A BLANCO */
            apagarTodasLasLuces();
            
            /* DIFERENCIA DE VELOCIDAD */
            let diferencia = kmhReal - kmhIdeal;
            
            /* DEMASIADO LENTO → ACELERAR */
            if (diferencia <= -2) {
                document.getElementById("izq-1").style.backgroundColor = "red";
                if (diferencia <= -4) {
                    document.getElementById("izq-2").style.backgroundColor = "red";
                }
                if (diferencia <= -6) {
                    document.getElementById("izq-3").style.backgroundColor = "red";
                }
            }
            /* DEMASIADO RÁPIDO → DESACELERAR */
            else if (diferencia >= 2) {
                document.getElementById("der-1").style.backgroundColor = "red";
                if (diferencia >= 4) {
                    document.getElementById("der-2").style.backgroundColor = "red";
                }
                if (diferencia >= 6) {
                    document.getElementById("der-3").style.backgroundColor = "red";
                }
            }
        }
      
        /* =====================================================
           GPS
           ===================================================== */
        if ( navigator.geolocation )
        {
            navigator.geolocation.watchPosition(
                (pos) => {
                    procesarGps(
                        pos.coords.latitude,
                        pos.coords.longitude,
                        pos.coords.speed
                    );
                },
                (err) => {
                    document
                        .getElementById("velocidad-real")
                        .innerText = "ERR";
                    
                    document
                        .getElementById("velocidad-ideal")
                        .innerText = "Ideal: --";

                    document
                        .getElementById("distancia-recorrida")
                        .innerText = "0 m";
                },
                {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                }
            );
        }
        else {
            document
                .getElementById("velocidad-real")
                .innerText = "GPS?";
            
            document
                .getElementById("velocidad-ideal")
                .innerText = "Ideal: --";

            document
                .getElementById("distancia-recorrida")
                .innerText = "0 m";
        }
      
    </script>
    
</body>

</html>
